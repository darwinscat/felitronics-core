# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [ main ]          # NOT "feat/**": a branch with a PR was getting TWO full runs of all 13 jobs
  pull_request:                 # for one push (measured: p81 81274f28 -> runs 34991274385 and 34991354360,
  workflow_dispatch:            # 45 s apart). `pull_request` already covers every branch, and covers it
                                # MERGED INTO main, which is the stricter thing to test. A branch with no PR
                                # open simply does not burn the pool twice.

# One live run per branch or PR. Without this, a push on top of a push leaves the first one running to the
# end against code nobody will merge, and on the scarcest runners that is the whole queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WHICH TESTS THIS CHANGE NEEDS — by subject, derived from the tree (tools/ci/scope.py says how).
  # A pull request that touches only prose runs nothing; one that touches only modules/ runs those modules and
  # everything that includes them; anything else — tools/, CMake, CI — and anything that is not a pull request
  # runs everything. A release branch therefore always gets the whole matrix before its tag.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode:  ${{ steps.plan.outputs.mode }}
      regex: ${{ steps.plan.outputs.regex }}
      abi:   ${{ steps.plan.outputs.abi }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # a pull_request checkout is the merge commit: HEAD^1 is the base it merges into
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 tools/ci/scope.py HEAD^1 HEAD
          else
            python3 tools/ci/scope.py --all
          fi

  build-test:
    name: ${{ matrix.os }} pffft=${{ matrix.pffft }} nam=${{ matrix.nam }}
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    # SELF-HOSTED FOR THE macOS ROWS. GitHub's hosted macos-latest is a 3-core arm64 VM and it is the
    # scarcest runner in the pool: measured on this suite, one macOS cell is 23.9-39.6 min of which 35.6 is
    # COMPILING (Configure 0.5, Test 3.3), against 9.6 min for the same cell on ubuntu. LafoxsMacStudio is
    # the same ISA and the same Apple toolchain, so nothing about coverage changes - only the wait.
    # THE FORK GATE IS NOT OPTIONAL: this repository is public, and a self-hosted runner executes whatever
    # a pull request brings. A PR from a fork therefore keeps the hosted runner; only code that already
    # lives in this repository runs on hardware that is not disposable.
    runs-on: ${{ (matrix.selfHosted && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","macOS","ARM64","studio"]') || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:          # OFF/OFF proves the default header-only path on every toolchain. NAM is also
          - { os: ubuntu-latest,  pffft: OFF, nam: OFF }   # compiled on all three; pffft ON covers the two SIMD
          - { os: macos-latest,   pffft: OFF, nam: OFF, selfHosted: true }   # arches we ship: x86-64/SSE (ubuntu) + arm64/NEON
          - { os: windows-latest, pffft: OFF, nam: OFF }   # (macos). Its cross-backend NULL suite runs on ON.
          - { os: macos-latest,   pffft: OFF, nam: ON,  selfHosted: true }
          - { os: windows-latest, pffft: OFF, nam: ON  }
          - { os: ubuntu-latest,  pffft: ON,  nam: ON  }
          - { os: macos-latest,   pffft: ON,  nam: ON,  selfHosted: true }
          # arm64 LINUX — the axis nothing above covers. Every other row confounds two variables: the two
          # arm64 rows are also the only Apple rows, so "arm64" and "Apple's toolchain" always move together
          # and a divergence cannot be attributed. It is not a hypothetical distinction — the P0 spike found
          # Apple's libm returning different doubles from tan() than musl and glibc at 88.2/192 kHz, i.e. the
          # outlier was the TOOLCHAIN while the ISA was innocent (docs/P0-WASM-SPIKE.md). glibc-on-arm64 is
          # the cell that separates them. Free for public repositories, same steps as every other row.
          - { os: ubuntu-24.04-arm, pffft: OFF, nam: OFF }
          # windows-latest + pffft ON is a fast-follow (pending a first green MSVC-pffft run); the OFF row
          # already proves the core compiles + tests on Windows.
    steps:
      - uses: actions/checkout@v7   # v5 runs on Node 24 (v4 is pinned to the deprecated Node 20)
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_BUILD_TESTS=ON -DFELITRONICS_WITH_PFFFT=${{ matrix.pffft }} -DFELITRONICS_WITH_NAM=${{ matrix.nam }}
      - name: Toolchain
        shell: bash
        # A self-hosted macOS runner inherits launchd's PATH — /usr/bin:/bin:/usr/sbin:/sbin — and Homebrew
        # is not on it, which is where that machine's cmake, ninja and node actually live (measured:
        # `command -v cmake` empty, /opt/homebrew/bin/cmake 4.4.3 present). A hosted runner ships cmake on
        # the default PATH, so this gap is invisible until the first self-hosted run dies at Configure with
        # `cmake: command not found`. Prepend it where it exists; where it does not, this does nothing.
        run: |
          if [ -d /opt/homebrew/bin ]; then
            echo /opt/homebrew/bin >> "$GITHUB_PATH"
            export PATH=/opt/homebrew/bin:$PATH
          fi
          echo "runner: $(uname -s) $(uname -m)"
          cmake --version | head -1
          ninja --version 2>/dev/null && echo "(ninja, above)" || echo "(no ninja — the default generator it is)"
      - name: Build
        shell: bash
        # A BARE `-j` MEANS UNLIMITED, not "use the cores" - the same footgun 7eb0894 fixed for CodeQL and
        # nowhere else. On a 3-core box that is a pile of compilers competing for 7 GB, which is most of why
        # the macOS rows were 35 min of build. Ask for the cores the machine actually has.
        run: |
          n=$( (getconf _NPROCESSORS_ONLN || nproc || sysctl -n hw.ncpu) 2>/dev/null | head -1 )
          echo "building with -j ${n:-4}"
          cmake --build build --config Release -j "${n:-4}"   # --config: required by multi-config gens (VS)
      - name: Test
        # The perf-shaped suites run VERBOSE first, then everything runs normally. Two lines, and they
        # exist because `--output-on-failure` prints a test's stdout only when it FAILS — so every gate
        # that compares timings is invisible in a green run, and you cannot tell a gate from an ornament.
        # That bit twice in one day: when the new arm64 row went red nobody could see what ratio it had
        # measured, and when the pane gate was repaired nobody could see whether it now passed by 2.2x or
        # by 1.02x. Same red on a real failure (the verbose run fails first and prints everything); on a
        # green run, the numbers are in the log. `-R` matching nothing exits 0, so the pffft=OFF rows just
        # skip that one. Costs ~3 s.
        env:
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          SCOPE_REGEX: ${{ needs.scope.outputs.regex }}
        shell: bash
        run: |
          ctest --test-dir build -C Release -V -R 'felitronics_pffft_tests|felitronics_spectrum_pane_perf_tests|felitronics_analysis_tests'
          SEL=(); if [ "$SCOPE_MODE" = selected ]; then SEL=(-R "$SCOPE_REGEX" --no-tests=error); fi
          ctest --test-dir build -C Release --output-on-failure "${SEL[@]}"   # -C likewise (no-op on single-config)

  # Dedicated ASan + UBSan job. UBSan makes platform-divergent UB LOUD on x86-64 (integer /0, signed
  # overflow, OOB shift, null store) that is SILENT on the dev machine (Apple-Silicon ARM64) — the exact
  # class that let an unprepared-engine divide-by-zero ship and only surface as a Windows crash. Separate
  # job (Linux/Clang-specific flags) rather than a 4th OS-matrix row.
  sanitizers:
    name: ubuntu-clang-asan-ubsan
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    # SELF-HOSTED ON deb for the same reason the macOS rows are on the Studio: this row was 19.7-28.1 min
    # on a 4-core hosted VM, and deb has 20 threads. The fork gate is the same one: a pull request whose
    # head is not in this repository keeps the hosted runner.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","deb"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure (ASan + UBSan, hard-fail on any UB)
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang
          -DFELITRONICS_BUILD_TESTS=ON
          -DFELITRONICS_ENABLE_SANITIZERS=ON
          -DFELITRONICS_WITH_PFFFT=ON
          -DFELITRONICS_WITH_NAM=ON
        # pffft ON here too, so the vendored C runs under ASan+UBSan. CMAKE_C_COMPILER=clang is REQUIRED: the
        # sanitizer runtime is clang's (CXX=clang++), and a gcc-compiled pffft.c would link the wrong ASan.
      - name: Build
        run: cmake --build build-san -j "$(nproc)"
      - name: Test
        env:
          # LSan (Linux-only; macOS has no LeakSanitizer) → this job is where leaks fail the build. It caught
          # a real one: NeuralStage held its live model as a raw pointer with no destructor, leaking it on
          # teardown — now fixed (~NeuralStage frees it; a ctors==dtors test guards it on every platform).
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        # No wall-clock gate here, and therefore every core. spectrum_pane_perf compares timings; under ASan it
        # measures the instrumentation, and on deb — a machine other sessions build on — it measures THEM: it
        # failed exactly that way while four other builds were running. The gate keeps running where it means
        # something, in the build-test matrix. Without it, the 132 tests may run together, and the five that
        # take 290, 229, 119, 104 and 92 s under ASan stop queueing behind each other.
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          SCOPE_REGEX: ${{ needs.scope.outputs.regex }}
        run: |
          SEL=(); if [ "$SCOPE_MODE" = selected ]; then SEL=(-R "$SCOPE_REGEX" --no-tests=error); fi
          ctest --test-dir build-san -j "$(nproc)" --output-on-failure -E spectrum_pane_perf "${SEL[@]}"

  # Dedicated gcc-14 job. The matrix above has no "compiler" dimension — each OS row takes whatever its
  # image ships — so the newest GCC is simply not built anywhere: ubuntu-latest defaults to g++-13. That is
  # not a theoretical gap. `felitronics_saturation_theory_tests` was RED on gcc 14.2 / Debian 13 on UNTOUCHED
  # main while every row here was green, and it stayed invisible until it was run off a developer's second
  # machine (PR #105: a "float-ulp noise floor" constant of 2e-7 sat between 2^-23 and 2^-22, so a two-ulp
  # residual tripped it — which toolchain landed on which side was luck). A finding that only a machine
  # OUTSIDE CI can make is a finding CI is not making. Separate job, not a 4th OS-matrix row, for the same
  # reason as the sanitizers above: the flags are toolchain-specific.
  gcc-14:
    name: ubuntu-gcc-14
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install g++-14
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Configure
        env: { CC: gcc-14, CXX: g++-14 }
        run: cmake -S . -B build-gcc14 -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_BUILD_TESTS=ON -DFELITRONICS_WITH_PFFFT=ON -DFELITRONICS_WITH_NAM=ON
      - name: Build
        run: cmake --build build-gcc14 -j 4
      - name: Test
        env:
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          SCOPE_REGEX: ${{ needs.scope.outputs.regex }}
        run: |
          ctest --test-dir build-gcc14 -V -R 'felitronics_pffft_tests|felitronics_spectrum_pane_perf_tests|felitronics_analysis_tests'
          SEL=(); if [ "$SCOPE_MODE" = selected ]; then SEL=(-R "$SCOPE_REGEX" --no-tests=error); fi
          ctest --test-dir build-gcc14 --output-on-failure "${SEL[@]}"

  # wasm-audio — the tier DSP-ARCHITECTURE.md §2 declares, GATED here instead of aspirational. Builds every
  # default module for wasm32 with exceptions and RTTI off and no pthreads, runs the whole suite in node, and
  # proves the no-threads claim from the ARTIFACTS rather than from the command line. It is also the only
  # place CI compiles the P0 spike at all — that build broke unnoticed once, precisely because nothing here
  # touched it.
  #
  # WHAT THIS GATE ACTUALLY CATCHES, so nobody reads more into a green tick than it earns:
  #   an exception or RTTI            -> COMPILE error (the preset's -fno-exceptions -fno-rtti)
  #   an incompatible dependency      -> compile/link error
  #   an allocation in process()      -> RUNTIME failure. Emscripten is libc++, so felitronics_test.h's
  #                                      okNoAlloc() takes its enforcing branch — on Linux/libstdc++ it does
  #                                      not, so this tier enforces what the ubuntu rows only record.
  #   a THREAD on a live path         -> LINK error, but ONLY because the tier links --wrap=pthread_create.
  #                                      On its own this would not be a build error at all: measured on emsdk
  #                                      6.0.9, without -pthread std::thread compiles AND LINKS (the pthread
  #                                      stubs return ENOTSUP) and merely aborts at runtime. Two things the
  #                                      wrap still cannot see: a thread in code never emitted (an unused
  #                                      inline, an uninstantiated template), and std::mutex, whose lock sits
  #                                      inside libc++-noexcept.a — hence the header lint below.
  #   denormal / law-8 violations     -> NOT caught, at all. That is a property of the CPU at runtime, not of
  #                                      the build (see the KWeightingFilter finding).
  #   long double ON AN EMITTED PATH  -> caught from the ARTIFACT: on wasm32 the type is software binary128,
  #                                      so every operation is a compiler-rt libcall (__addtf3, __multf3, …)
  #                                      standing in the object file as an undefined symbol. Measured: the
  #                                      tier's objects yield no hit, with no exclusion (the one sanctioned
  #                                      use, fcore_measure's correlation accumulator, is binary64 since P59a).
  #   long double in code NEVER emitted -> the text lint. Same split as the thread wrap and the header lint.
  #
  # ubuntu, NOT macos, and for the parity step that is load-bearing: Apple's libm and musl (what emscripten
  # compiles in) return different doubles from tan() at 88.2 and 192 kHz, so an arm64-macOS reference would
  # diverge from wasm for a reason that is not a regression. glibc agrees with musl at every rate measured.
  # docs/P0-WASM-SPIKE.md has the numbers.
  wasm-audio:
    name: wasm-audio-tier
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    # SELF-HOSTED ON deb for the same reason the macOS rows are on the Studio: this row was 19.7-28.1 min
    # on a 4-core hosted VM, and deb has 20 threads. The fork gate is the same one: a pull request whose
    # head is not in this repository keeps the hosted runner.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","deb"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install emsdk 6.0.9
        # Installed from upstream directly rather than through a third-party action, so the only thing this
        # job trusts is emscripten itself. 6.0.9 is the toolchain every number in docs/P0-WASM-SPIKE.md was
        # measured on; moving it should be a deliberate act, not drift.
        # `--branch 6.0.9` pins the CLONE too. Without it `--depth 1` fetches emsdk master — the installer
        # and the release manifest — and only the SDK *version argument* would be pinned, which is not the
        # same thing and would have made the word "pinned" here false.
        # A SELF-HOSTED RUNNER KEEPS $HOME, so a second run would find the clone already there and git would
        # refuse. Reuse an installed 6.0.9; install only on a machine that has none. A DIFFERENT version
        # already in place fails loudly on purpose — moving the toolchain is a deliberate act.
        run: |
          VER="$HOME/emsdk/upstream/emscripten/emscripten-version.txt"
          if grep -qs '"6.0.9"' "$VER"; then
            echo "emsdk 6.0.9 already in $HOME/emsdk — reusing it"
          elif [ -e "$HOME/emsdk" ]; then
            echo "::error::$HOME/emsdk exists but is not 6.0.9 ($(cat "$VER" 2>/dev/null)) — refusing to overwrite a toolchain"; exit 1
          else
            git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
            "$HOME/emsdk/emsdk" install 6.0.9
          fi
          "$HOME/emsdk/emsdk" activate 6.0.9
          source "$HOME/emsdk/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "PATH=$PATH"   >> "$GITHUB_ENV"
      - name: Configure + build the tier
        run: cmake --preset wasm-audio && cmake --build --preset wasm-audio
      - name: Run the suite in node
        # ctest drives each test .js through node: the Emscripten toolchain sets CMAKE_CROSSCOMPILING_EMULATOR.
        # Same reasoning as the ASan row: the wall-clock gate measures node and the shared machine, not the
        # code, and it already runs natively in build-test. Without it the suite can use every core.
        env:
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          SCOPE_REGEX: ${{ needs.scope.outputs.regex }}
        run: |
          SEL=(); if [ "$SCOPE_MODE" = selected ]; then SEL=(-R "$SCOPE_REGEX" --no-tests=error); fi
          ctest --preset wasm-audio -j "$(nproc)" -E spectrum_pane_perf "${SEL[@]}"
      - name: No threads — audited on EVERY emitted .wasm, not one sample
        run: node tools/wasm/check-no-threads.mjs --all build-wasm-audio
      - name: No threading header in a public module header
        # The --wrap above makes a std::thread on a live code path a LINK error, which is the real gate.
        # It does not catch std::mutex: mutex::lock lives inside libc++-noexcept.a and emscripten's stub
        # (library_pthread_stub.c) silently returns 0, so a lock would be a no-op nobody noticed. This lint
        # closes that, and it is honest about being a lint: it reads text, not the artifact.
        run: |
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(thread|mutex|shared_mutex|condition_variable|future|latch|barrier|semaphore|stop_token)>' modules/*/include; then
            echo "^^ the wasm-audio tier is single-threaded by contract (DSP-ARCHITECTURE.md 2)"; exit 1
          fi
          echo "no threading headers in public module headers"
      - name: No long double arithmetic in any emitted object — law 9, from the ARTIFACT
        # The stronger half of law 9's enforcement, and it is free here because wasm32 hands it to us: on
        # that target `long double` is IEEE binary128 in SOFTWARE, so every operation on it is a compiler-rt
        # libcall — `__addtf3`, `__multf3`, `__trunctfdf2` — and shows up as an UNDEFINED SYMBOL in the
        # object file. Measured on emsdk 6.0.9: an accumulate in `long double` emits them, `sizeof(long
        # double)` alone emits nothing (correctly — naming the type is not using it), plain `double` emits
        # nothing. The tier's objects match NOTHING, and nothing is excluded: the one named exclusion this step
        # used to carry — fcore_measure.cpp.o's `long double` correlation accumulator — became the stereo band's
        # binary64 formula in P59a, so the gate now covers that file too.
        #
        # It pairs with the text lint below exactly as `--wrap=pthread_create` pairs with the header lint:
        # this one reads EMITTED code, so no comment can fool it and a type reached through a macro or an
        # alias cannot hide; it is blind to code never emitted (an uninstantiated template, an unused
        # inline), which is precisely what the text lint covers.
        run: |
          NM="$EMSDK/upstream/bin/llvm-nm"
          if find build-wasm-audio -name '*.o' -print0 \
             | xargs -0 "$NM" --undefined-only --print-file-name \
             | grep -E ' U (__(add|sub|mul|div|neg|extend[sd]f|trunc|fix|float|eq|ne|lt|le|gt|ge|unord)tf[0-9a-z]*|(sqrt|pow|exp|log|sin|cos|tan|fabs|floor|ceil|fmod|hypot|fma)l)$'; then
            echo "^^ a wasm32 long double operation is a compiler-rt libcall — DSP-ARCHITECTURE.md §2 law 9."
            exit 1
          fi
          echo "no long double arithmetic in any emitted object of the tier"
      - name: No long double in core code — law 9, enforced
        # DSP-ARCHITECTURE.md §2 law 9 said in its own text that nothing enforced it. This is the
        # enforcement. It lives in THIS job rather than a new one because its sibling lint (the threading
        # header grep) and the negative-control step below are already here, and a 2-second scan does not
        # deserve a runner of its own — but note the law is not wasm-specific: `long double` is 8 bytes /
        # 53 mantissa bits on arm64 macOS, 16/64 on x86-64 and 16/113 on wasm32, so it breaks determinism
        # on EVERY tier. Not a bare grep, and for a specific reason: unlike `#include <thread>`, the words
        # "long double" occur in prose all the time — law 9's own explanation is full of them — so the
        # scanner lexes first and blanks comments, strings and raw strings before matching.
        run: |
          node tools/lint/check-no-long-double.mjs --self-test
          node tools/lint/check-no-long-double.mjs
      - name: The libm audit — no system transcendental on a path that crosses a row
        # P80. The system libm is not the same function on every row: measured over the ranges this
        # library uses, Apple's and glibc's log10 differ at 4325 of 200000 points, their pow10 at 41 %.
        # Every dB threshold is built from pow10, so a threshold that moves by an ulp moves a DECISION.
        # This lint keeps the values that cross a boundary on core::det, and — the half that matters —
        # keeps them off the CARRIERS, ordinary functions like core::gainToDb that reach libm without
        # ever spelling `std::`. The analyzers it defends contain no direct std:: call at all; they were
        # exposed entirely through those, which is why a grep-shaped lint would pass and prove nothing.
        run: |
          node tools/lint/check-det-math.mjs --self-test
          node tools/lint/check-det-math.mjs
      - name: One allocation counter — P52, enforced
        # The copies are gone (61 hand-rolled counters, of which 50 replaced only the two default-aligned
        # forms and so could not see a single over-aligned allocation); this keeps them gone. It is the
        # SOURCE half of the gate: the runtime half lives in test_support/alloc_counter.h, probes both
        # shapes before main() and aborts the run — but a probe can only speak for a counter that was
        # included, and this is what notices a file that hand-rolls one again instead. Lexed, not grepped:
        # the words "operator new" are ordinary prose in this tree.
        run: |
          node tools/lint/check-alloc-counter.mjs --self-test
          node tools/lint/check-alloc-counter.mjs
      - name: The gates still gate — negative controls
        # A gate nobody tries to break is a gate nobody knows still works. Both of these are cheap and both
        # would have caught a real rot: the --wrap gate depends on libc++ keeping std::thread's constructor
        # header-inline, and a future emsdk that moves it into the archive would switch the gate off with
        # every row still green; and the artifact audit is a hand-written wasm parser.
        run: |
          set -e
          printf '#include <thread>\nint main(){ std::thread t([]{}); t.join(); return 0; }\n' > /tmp/thr.cpp
          if em++ -std=c++20 -O1 -fno-exceptions -fno-rtti -Wl,--wrap=pthread_create /tmp/thr.cpp -o /tmp/thr.js 2>/tmp/thr.err; then
            echo "CONTROL FAILED: a std::thread linked cleanly — the --wrap gate is not gating"; exit 1
          fi
          grep -q "__wrap_pthread_create" /tmp/thr.err || { echo "CONTROL FAILED: link failed for the wrong reason"; cat /tmp/thr.err; exit 1; }
          echo "control 1 ok: a live std::thread fails the link"
          em++ -std=c++20 -O1 -pthread /tmp/thr.cpp -o /tmp/thrp.js 2>/dev/null
          if node tools/wasm/check-no-threads.mjs /tmp/thrp.wasm /tmp/thrp.js > /dev/null 2>&1; then
            echo "CONTROL FAILED: the audit passed a -pthread artifact"; exit 1
          fi
          echo "control 2 ok: the artifact audit rejects a threaded module"
          # Control 3: the long-double lint. Its own --self-test above proves the MATCHER; this proves the
          # rest of it — that the scan actually reaches module code, reports file:line, and fails the step.
          # A lint that quietly stopped discovering files would pass its step forever without this.
          printf '// prose saying long double must be ignored\nusing Forbidden = long double;\n' \
            > modules/core/include/felitronics/core/_lint_control.h
          if node tools/lint/check-no-long-double.mjs > /dev/null 2>&1; then
            rm -f modules/core/include/felitronics/core/_lint_control.h
            echo "CONTROL FAILED: a long double in a module header did not fail the lint"; exit 1
          fi
          node tools/lint/check-no-long-double.mjs 2>&1 | grep -q "_lint_control.h:2" \
            || { rm -f modules/core/include/felitronics/core/_lint_control.h; echo "CONTROL FAILED: wrong line reported"; exit 1; }
          rm -f modules/core/include/felitronics/core/_lint_control.h
          node tools/lint/check-no-long-double.mjs > /dev/null
          echo "control 3 ok: the long-double lint fires on code, ignores prose, and the tree is clean again"
          # Control 4: the ARTIFACT half of law 9. It rests entirely on emscripten lowering binary128
          # arithmetic to __*tf* libcalls; an emsdk that gained native f128, or that renamed the routines,
          # would turn the gate off silently with every row green. This is what notices.
          printf 'double f(const float*p,int n){long double s=0.0L;for(int i=0;i<n;++i)s+=p[i];return (double)s;}\n' > /tmp/ld.cpp
          em++ -std=c++20 -O2 -fno-exceptions -fno-rtti -c /tmp/ld.cpp -o /tmp/ld.o
          "$EMSDK/upstream/bin/llvm-nm" --undefined-only /tmp/ld.o | grep -qE ' U __(add|extend)[a-z0-9]*tf' \
            || { echo "CONTROL FAILED: long double arithmetic no longer lowers to a tf libcall — the artifact gate is off"; exit 1; }
          printf 'unsigned g(){return (unsigned)sizeof(long double);}\n' > /tmp/ldsz.cpp
          em++ -std=c++20 -O2 -fno-exceptions -fno-rtti -c /tmp/ldsz.cpp -o /tmp/ldsz.o
          if "$EMSDK/upstream/bin/llvm-nm" --undefined-only /tmp/ldsz.o | grep -qE ' U __[a-z0-9]*tf'; then
            echo "CONTROL FAILED: sizeof(long double) alone now emits a libcall — the gate would false-positive on the ABI probe"; exit 1
          fi
          echo "control 4 ok: long double arithmetic still lowers to a tf libcall, and sizeof() alone still does not"
          # Controls 5-10: the libm audit. Its --self-test above proves the MATCHER; these prove the RULES,
          # and each one is a way this lint could go quietly dead. The carrier control (6) is the one that
          # matters most: the analyzers it defends contain no direct `std::` call, so a lint that only
          # caught control 5 would pass forever while the real exposure walked in through gainToDb.
          ZONEH=modules/analysis/include/felitronics/analysis/HumDetector.h
          MANH=modules/analysis/include/felitronics/analysis/PlotMap.h
          OFF=modules/core/include/felitronics/core/OfflineFft.h
          MANIFEST=tools/lint/det-math-manifest.txt
          SOLV=modules/mastering/include/felitronics/mastering/LoudnessSolver.h
          # Restore ONLY the files these controls touch. A bare `git checkout -- .` would also discard
          # anything else in the tree, which is harmless on a CI checkout and destructive if a human runs
          # this block locally to see what it does — and someone will.
          det_restore () { git checkout -- "$ZONEH" "$MANH" "$OFF" "$MANIFEST" "$SOLV"; }
          det_control () {  # det_control <n> <what> <expected substring>
            if node tools/lint/check-det-math.mjs > /dev/null 2>&1; then
              det_restore; echo "CONTROL FAILED ($1): the lint PASSED with $2 planted"; exit 1; fi
            node tools/lint/check-det-math.mjs 2>&1 | grep -qF "$3" \
              || { det_restore; echo "CONTROL FAILED ($1): fired but did not report '$3'"; exit 1; }
            det_restore; echo "control $1 ok: $2 is caught"
          }
          printf '\nnamespace { inline double p80c (double x) { return std::cos (x); } }\n' >> "$ZONEH"
          det_control 5 "a direct std::cos in a deterministic-zone header" "$ZONEH"
          printf '\nnamespace { inline double p80c (double x) { return felitronics::core::gainToDb (x); } }\n' >> "$ZONEH"
          det_control 6 "a CARRIER call (gainToDb) in the zone — the indirect half a grep cannot see" "[CARRIER]"
          printf '\nnamespace { inline double p80c (double x) { return std::tanh (x); } }\n' >> "$MANH"
          det_control 7 "a new libm call in a manifested file" "the calls in this file CHANGED"
          printf 'modules/core/include/felitronics/core/Config.h  [cos*1]  retain-local  planted\n' >> "$MANIFEST"
          det_control 8 "a stale manifest entry for a file with no calls" "no libm calls left"
          printf '\nnamespace { inline double p80c (double x) { return std::cos (x); } }   // libm-ok: unbacked\n' >> "$ZONEH"
          det_control 9 "a libm-ok marker with no ZONE_EXCEPTIONS entry behind it" "no entry for it in ZONE_EXCEPTIONS"
          sed -i 's|   // libm-ok: hypot, see ZONE_EXCEPTIONS||' "$OFF"
          det_control 10 "an allowed exception whose marker was deleted" "[ZONE-EXCEPTION-ROT]"
          # 11 is THE regression this lint was written after: reverting LoudnessSolver::peakDb to the
          # system spelling breaks "the solver's report IS the certificate, bit for bit". The first
          # version of the lint PASSED on it, because carrier calls were checked only inside the zone.
          sed -i 's|core::gainToDbDet (lin)|core::gainToDb (lin)|' "$SOLV"
          # And prove the mutation LANDED: an earlier version of this control keyed on `... : -200.0`,
          # which a refactor renamed to kPeakDbSilence, so the sed matched nothing and the lint's pass
          # read as a working gate. A stand that does not verify its own mutation is wired to nothing.
          grep -q 'core::gainToDb (lin)' "$SOLV" \
            || { det_restore; echo "CONTROL BROKEN (11): the sed planted nothing"; exit 1; }
          det_control 11 "LoudnessSolver::peakDb reverted to the system spelling" "$SOLV"
          # 12: the matcher used to read one line at a time, so a call whose parenthesis sat on the next
          # line was not a call at all — in the zone, with no marker needed, because nothing was recorded.
          printf '\nnamespace { inline double p80c (double x) { return std::cos\n    (x); } }\n' >> "$ZONEH"
          det_control 12 "a call split between its name and its parenthesis" "$ZONEH"
          node tools/lint/check-det-math.mjs > /dev/null \
            || { echo "CONTROL FAILED: the tree did not come back clean, so controls 5-12 proved nothing"; exit 1; }
          echo "controls 5-12 ok: the libm audit fires on every rule and the tree is clean again"
          # Control 5: the allocation counter, BOTH halves. First the lint's reach — its --self-test above
          # proves the matcher, this proves the scan actually lands on a test file and fails the step.
          printf 'void* operator new (unsigned long s);\n' > modules/core/tests/_lint_control.cpp
          if node tools/lint/check-alloc-counter.mjs > /dev/null 2>&1; then
            rm -f modules/core/tests/_lint_control.cpp
            echo "CONTROL FAILED: a private operator new did not fail the lint"; exit 1
          fi
          node tools/lint/check-alloc-counter.mjs 2>&1 | grep -q "_lint_control.cpp:1" \
            || { rm -f modules/core/tests/_lint_control.cpp; echo "CONTROL FAILED: wrong line reported"; exit 1; }
          rm -f modules/core/tests/_lint_control.cpp
          node tools/lint/check-alloc-counter.mjs > /dev/null
          echo "control 5a ok: the alloc-counter lint fires on code, ignores prose, and the tree is clean again"
          # ...and then the RUNTIME half, which is the one that actually decides whether "no heap allocation"
          # means anything. Take the shared counter, delete its two over-aligned `operator new` lines — the
          # exact state fifty suites were in — and require the binary to REFUSE to run. Compiled standalone
          # with the system compiler, so it costs a second and needs no cmake.
          mkdir -p /tmp/ac
          # A DELTA, not `count > 0`: the startup probe already spends eight allocations, so an absolute
          # comparison here would hold even with the vector deleted — a vacuous assertion inside the control
          # that exists to catch vacuous assertions. (Found in the crew round.)
          printf '#include <felitronics_test.h>\n#include <alloc_counter.h>\n#include <vector>\nint main(){ const long long b = alloc::count.load(); { std::vector<int> v(4,1); volatile int s = v[0]; (void) s; } felitronics::test::ok (alloc::count.load() > b, "the vector allocation is counted"); return felitronics::test::report(); }\n' > /tmp/ac/probe.cpp
          c++ -std=c++20 -O2 -I test_support /tmp/ac/probe.cpp -o /tmp/ac/probe
          /tmp/ac/probe > /dev/null || { echo "CONTROL FAILED: the intact counter does not pass its own probe"; exit 1; }
          sed -E '/^void\* operator new .*std::align_val_t a\) +\{ return felitronics/d; /^void\* operator new\[\].*std::align_val_t a\) +\{ return felitronics/d' \
            test_support/alloc_counter.h > /tmp/ac/alloc_counter.h
          cmp -s test_support/alloc_counter.h /tmp/ac/alloc_counter.h \
            && { echo "CONTROL FAILED: the mutation removed nothing — the counter no longer has the lines it names"; exit 1; }
          c++ -std=c++20 -O2 -I /tmp/ac -I test_support /tmp/ac/probe.cpp -o /tmp/ac/probe_blind
          if /tmp/ac/probe_blind > /tmp/ac/out.txt 2>&1; then
            echo "CONTROL FAILED: a counter blind to the over-aligned form still ran to a clean exit"; cat /tmp/ac/out.txt; exit 1
          fi
          grep -q "UNCOUNTED: operator new(size_t, align_val_t)" /tmp/ac/out.txt \
            || { echo "CONTROL FAILED: it failed for the wrong reason"; cat /tmp/ac/out.txt; exit 1; }
          echo "control 5b ok: a counter missing the over-aligned form refuses to run at all"
      - name: Checked build — SAFE_HEAP + assertions + stack-overflow checks
        # Only for the whole matrix. A change confined to modules/ leaves the wasm PLUMBING as it was; its
        # memory errors in module code are the ASan row's job, natively. The release branch runs this always.
        if: needs.scope.outputs.mode == 'all'
        # The libsoxr lesson from the P0 report: a release build that works proves less than a checked build
        # that agrees with it. Cheap here — ~15 s to build, ~17 s to run. STACK_OVERFLOW_CHECK is what turns
        # a blown stack from "wrong answers, then memory access out of bounds" into a named diagnosis.
        # The perf suite is excluded: its assertions are RELATIVE wall-clock, and SAFE_HEAP instruments every
        # load and store, so it measures the instrumentation rather than the code.
        run: |
          cmake --preset wasm-audio -B build-wasm-checked -DFELITRONICS_WASM_ASSERTIONS=2 \
                -DCMAKE_EXE_LINKER_FLAGS="-sSAFE_HEAP=1 -sSTACK_OVERFLOW_CHECK=2"
          cmake --build build-wasm-checked -j "$(nproc)"
          # All cores: the one test that must not share the machine — the wall-clock gate — is excluded right
          # here by -E, so nothing in this run measures time. Under SAFE_HEAP every load and store is checked,
          # which makes this the slowest test run in the workflow; capping it at 4 left deb three-quarters idle.
          ctest --test-dir build-wasm-checked -j "$(nproc)" --output-on-failure -E spectrum_pane_perf
      - name: The P0 spike artifacts still build
        if: needs.scope.outputs.mode == 'all' || needs.scope.outputs.abi == 'true'
        run: ./tools/wasm/build.sh
      - name: NULL test — native vs wasm, bit-exact, on a GENERATED fixture
        if: needs.scope.outputs.mode == 'all' || needs.scope.outputs.abi == 'true'
        # No private audio in a public repo: the fixture is synthesised from an integer PRNG with no
        # transcendental in sight, so it is byte-identical on any engine. The comparison surface is the
        # pre-gate 400 ms block-energy vector, not the scalar LUFS — a gated scalar is discontinuous in its
        # own inputs and cannot carry a bit-exactness claim (docs/P0-WASM-SPIKE.md). The checked artifact
        # (SAFE_HEAP + ASSERTIONS=2 + stack checks) is diffed too: building it without running it would
        # prove nothing, and the libsoxr precedent is exactly a clean build that died at runtime.
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_BUILD_TESTS=OFF
          cmake --build build-native -j "$(nproc)" --target fcore_measure
          node tools/wasm/make-fixture.mjs fixture.f32 48000 2 10
          # The generator claims to be deterministic by construction; this turns that into a MEASURED fact
          # on a different machine, OS and node build than the one it was written on. Recorded from two
          # local runs on macOS/arm64. If a future edit to the generator changes the signal, this line is
          # what says so, instead of every report quietly citing a different "97 block energies".
          echo "ad4b9513d9d9b88827a07116d36ceafa5c73a7602239c8e4ff6d49c6e2beac39  fixture.f32" | sha256sum -c -
          ./build-native/tools/fcore_measure blocks 48000 2 fixture.f32 > native.txt
          node tools/wasm/parity.mjs tools/wasm/build/fcprobe.node.js  48000 2 fixture.f32 > wasm.txt
          node tools/wasm/parity.mjs tools/wasm/build/fcprobe.debug.js 48000 2 fixture.f32 > wasm-checked.txt
          diff native.txt wasm.txt
          diff native.txt wasm-checked.txt
          echo "bit-identical: $(sed -n 's/^blocks //p' native.txt) block energies + true peak + sample peak"
      - name: NULL test — waveform peaks, stereo band and needle, native vs wasm, bit-exact
        if: needs.scope.outputs.mode == 'all' || needs.scope.outputs.abi == 'true'
        # P59a: the page's waveform and stereo pictures and the sidecars that stand in for them now come from one
        # definition (analysis::WaveformPeaks / StereoColumns via fcore::ShapeProbe), and this is the proof the
        # two roads to it — the native CLI a server would run and the browser module — draw the same bits. Every
        # mix mode; bucket and column counts that are the page's (1000, 1100), the spec's default (1200), one, and
        # more than the frames hold; a mono, a stereo and a six-channel fixture at three rates; the needle over the
        # whole file, a stretch, one frame and an empty stretch. Release and checked artifacts both.
        run: |
          node tools/wasm/make-fixture.mjs fix6.f32 44100 6 3
          node tools/wasm/make-fixture.mjs fix1.f32 22050 1 2
          M=./build-native/tools/fcore_measure
          n=0
          check() { f=$1; sr=$2; ch=$3; mode=$4; shift 4
            $M "$mode" "$sr" "$ch" "$f" "$@" > shapes-native.txt
            test -s shapes-native.txt
            for mod in fcprobe.node.js fcprobe.debug.js; do
              node tools/wasm/shapes-parity.mjs "tools/wasm/build/$mod" "$mode" "$sr" "$ch" "$f" "$@" > shapes-wasm.txt
              diff shapes-native.txt shapes-wasm.txt || { echo "DIFFER: $mode $sr $ch $* ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          for mix in avr L R max; do for b in 1 1000 1100 100000; do
            check fixture.f32 48000 2 waveform --buckets $b --mix $mix
            check fix6.f32    44100 6 waveform --buckets $b --mix $mix
            check fix1.f32    22050 1 waveform --buckets $b --mix $mix
          done; done
          for c in 1 1100 1200 50000; do
            check fixture.f32 48000 2 stereo --columns $c
            check fix6.f32    44100 6 stereo --columns $c
            check fix1.f32    22050 1 stereo --columns $c
          done
          check fixture.f32 48000 2 needle
          check fixture.f32 48000 2 needle --from 12345 --to 400000
          check fix6.f32    44100 6 needle --from 7 --to 8
          check fix1.f32    22050 1 needle --from 100 --to 100
          echo "bit-identical: $n native-vs-wasm comparisons of peaks, stereo band and needle"
      - name: NULL test — the clipped runs, native vs wasm, bit-exact
        if: needs.scope.outputs.mode == 'all' || needs.scope.outputs.abi == 'true'
        # P71: analysis::ClipDetector now has a way out (fcore::ClipProbe, `fcore_measure clips` and
        # fc_probe_clips_*), and this is the proof the two roads report the same runs. The generated fixture
        # above is CLEAN — its flat stretches are square waves and a hit that stops, which the detector
        # correctly reports as clipping-free — so it is kept as the zero-run case and a second, CLAMPED
        # generator provides the runs. Both are transcendental-free and their bytes are pinned.
        #
        # --chunk IS THE LAW-8a HANDLE. It is honoured by the native tool and ignored by the module (which
        # always measures in one call), so every row below that carries it compares an N-sample-at-a-time
        # native run against a whole-buffer wasm run: re-slicing invariance and cross-toolchain identity in
        # the same diff. Without it both sides cut the stream at multiples of fcore::ClipProbe::kChunk and the
        # comparison would say nothing at all about slicing.
        run: |
          node tools/wasm/make-clip-fixture.mjs clipfix.f32  48000 2 2
          node tools/wasm/make-clip-fixture.mjs clipfix6.f32 44100 6 1
          node tools/wasm/make-clip-fixture.mjs clipfix1.f32 22050 1 1
          # Deterministic by construction, turned into a measured fact on another machine, OS and node build.
          # The generator's passages are fractions of the length, so even the 1-second fixtures carry all
          # seven: quiet noise, silence, a hard clamp, a clean passage, a shallow clamp, non-finite HOLES
          # (150 / 191 / 17 of them here) and a clamped tail whose runs exist only after finish().
          sha256sum -c - <<'SUMS'
          fab7d41e1925e58f58462e39b7c2481dc0418b5aa28cc0b4203f3c6a710f955f  clipfix.f32
          91de246c7f8f6fc98df1957762c87c50fbc8fda87abddff974753ef7d19ecc85  clipfix6.f32
          b0e173a8d8f0732b0882425367f8065b11ed986b925c6a49b99aa4b32ece7171  clipfix1.f32
          SUMS
          M=./build-native/tools/fcore_measure
          n=0
          check() { f=$1; sr=$2; ch=$3; shift 3
            $M clips "$sr" "$ch" "$f" "$@" > clips-native.txt
            test -s clips-native.txt
            for mod in fcprobe.node.js fcprobe.debug.js; do
              node tools/wasm/clips-parity.mjs "tools/wasm/build/$mod" clips "$sr" "$ch" "$f" "$@" > clips-wasm.txt
              diff clips-native.txt clips-wasm.txt || { echo "DIFFER: clips $sr $ch $f $* ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          # AND THE REFUSALS MUST MATCH TOO. A byte diff of two successful commands says nothing about the
          # command lines both sides are supposed to REJECT, and a domain mismatch there is a silent
          # disagreement: `--max-runs 4294967296` wrapped to 0 in a uint32_t parameter and came back as a
          # cheerful `maxruns=0` report from the module while the native tool exited 2. Both sides must refuse,
          # both must print nothing to stdout.
          refuse() { f=$1; sr=$2; ch=$3; shift 3
            if $M clips "$sr" "$ch" "$f" "$@" > r-native.txt 2>/dev/null; then
              echo "NATIVE ACCEPTED what it should refuse: clips $sr $ch $f $*"; exit 1; fi
            test ! -s r-native.txt || { echo "NATIVE printed a report and then failed: $*"; exit 1; }
            for mod in fcprobe.node.js fcprobe.debug.js; do
              if node tools/wasm/clips-parity.mjs "tools/wasm/build/$mod" clips "$sr" "$ch" "$f" "$@" \
                   > r-wasm.txt 2>/dev/null; then
                echo "WASM ACCEPTED what native refuses: clips $sr $ch $f $* ($mod)"; exit 1; fi
              test ! -s r-wasm.txt || { echo "WASM printed a report and then failed: $* ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          # a file with NO clipping at all, then clamped material at three rates and three widths
          check fixture.f32   48000 2
          check clipfix.f32   48000 2
          check clipfix6.f32  44100 6
          check clipfix1.f32  22050 1
          # the detector's own capacity running out: the count keeps counting, the list says it is short
          # 1051 is this fixture's exact run count, so 1050/1051 straddles the completeness boundary
          for c in 0 1 3 500 1050 1051 1052; do check clipfix.f32 48000 2 --max-runs $c; done
          # re-slicing, across the tier
          for k in 1 2 3 7 959 960 961 8191 8192; do check clipfix.f32 48000 2 --chunk $k; done
          for k in 1 7 882; do check clipfix6.f32 44100 6 --chunk $k; check clipfix1.f32 22050 1 --chunk $k; done
          refuse clipfix.f32 48000 2 --max-runs 4294967296
          refuse clipfix.f32 48000 2 --max-runs 1048577
          refuse clipfix.f32 48000 2 --chunk 2147483648
          refuse clipfix.f32 48000 2 --max-runs 5 --max-runs 6
          refuse clipfix.f32 48000 2 --bogus 1
          refuse clipfix.f32 48000 2 --max-runs
          refuse clipfix.f32 48000 0
          refuse clipfix.f32 48000 17
          # THE RATE FLOOR, FROM BOTH SIDES (P51: the core's 8000 Hz; it was 1000 here, with `999` the row).
          # The refusal rows see the floor move down; they cannot see it move UP, so 8000 itself is a comparison
          # that must produce a report. 44.1 is the mistake the floor exists for: kilohertz passed as hertz.
          refuse clipfix.f32 7999 2
          refuse clipfix.f32 7999.999999999999 2
          refuse clipfix.f32 44.1 2
          refuse clipfix.f32 1000 2
          check  clipfix.f32 8000 2
          refuse clipfix.f32 768001 2
          refuse clipfix.f32 0 2
          : > empty.f32 && refuse empty.f32 48000 2
          echo "bit-identical: $n native-vs-wasm comparisons of the clipped runs, refusals included"

      - name: the five offline analyzers — native vs wasm, byte for byte (P77)
        if: needs.scope.outputs.mode == 'all' || needs.scope.outputs.abi == 'true'
        run: |
          set -euo pipefail
          # WHY THIS GATE CAN EXIST AT ALL. Before P79 it could not: the five analyzers computed their
          # windows, dB values and thresholds through the SYSTEM libm, which is not the same function on
          # every row — 4032 of 131072 Hann coefficients differ between Apple's libm and musl's at order
          # 17, and 41 % of pow10 results over the dB range these thresholds live in. A byte diff of the
          # two rows was therefore unattainable for hum, lowend and forensics, and the acceptance had been
          # weakened to a wasm-only comparison. core::det made the original criterion reachable, so it is
          # the one enforced here.
          node tools/wasm/make-fixture.mjs fixture441.f32 44100 2 10   # 48 kHz one already exists above
          # AND A PROGRAMME THAT ACTUALLY HAS HUM. On the loudness fixture HumDetector finds zero quiet
          # frames and returns NoQuietStretch before reaching its peak search at all: 47 lines of "nothing
          # found" satisfy `test -s` and diff clean without the measurement path ever running. This one
          # carries a 50 Hz line with three harmonics in two quiet stretches, each longer than a whole
          # analysis window plus a hop — which is what it takes for a frame to sit entirely inside one.
          node tools/wasm/make-hum-fixture.mjs humfix.f32 48000 2 30
          M=./build-native/tools/fcore_measure
          n=0
          check() { mode=$1; sr=$2; ch=$3; f=$4
            $M "$mode" "$sr" "$ch" "$f" > an-native.txt
            # A clean diff of two empty files proves nothing: refuse to count a comparison with no content.
            test -s an-native.txt
            for mod in fcprobe.node.js fcprobe.debug.js; do
              node "tools/wasm/$mode-parity.mjs" "tools/wasm/build/$mod" "$sr" "$ch" "$f" > an-wasm.txt
              test -s an-wasm.txt
              diff an-native.txt an-wasm.txt || { echo "DIFFER: $mode $sr $ch $f ($mod)"; exit 1; }
              n=$((n+1))
            done; }
          # Both rates matter and not for symmetry: at 44.1 kHz the filter arguments of these analyzers
          # (30 Hz, 9 kHz, the K-weighting corner) are ones where the system libm's tan DID differ between
          # rows, so this is the rate that would have caught a regression in the deterministic floor.
          for mode in report forensics hum lowend bursts; do
            check "$mode" 48000 2 fixture.f32
            check "$mode" 44100 2 fixture441.f32
          done
          # hum again, on the programme that reaches its measurement — and asserted to be a real finding,
          # because a clean diff of two "nothing found" reports is the shape this whole gate exists to
          # refuse.
          check hum 48000 2 humfix.f32
          grep -q '^ch 0 valid 1 reason 0 mains 1' an-native.txt \
            || { echo "the hum fixture stopped finding its line — the gate is comparing nothing again"; exit 1; }
          echo "bit-identical: $n native-vs-wasm comparisons across five analyzers, two rates, two modules"

      - name: the price of a measurement — the same demand on both tiers (P81)
        if: needs.scope.outputs.mode == 'all' || needs.scope.outputs.abi == 'true'
        # `fc_probe_<mode>_storage_bytes` publishes what each analyzer's storageFor() is about to ask the
        # heap for, so a page can decide BEFORE the allocation that -fno-exceptions turns into an abort.
        # Two things are checked here that the native suite structurally cannot:
        #   * that the five names reached the ARTIFACT. felitronics_analysis_abi_tests compiles
        #     fc_probe.cpp natively; an export missing from the module leaves it green and the page holding
        #     `undefined`, and `cmp` cannot detect a function nobody called.
        #   * that the two TIERS agree on the number. wasm32 has its own std::size_t and its own struct
        #     layouts, so this is a cross-tier oracle — a release-vs-checked diff of one tier would happily
        #     compare a wrong demand with itself.
        run: |
          set -euo pipefail
          # build-native was configured with tests OFF (it only needed fcore_measure); turning them on
          # re-uses its object cache and adds this one target.
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_BUILD_TESTS=ON
          cmake --build build-native -j "$(nproc)" --target felitronics_analysis_abi_tests
          ./build-native/tools/felitronics_analysis_abi_tests --storage-table > storage-native.txt
          test -s storage-native.txt
          # A table of nothing but refusals would compare clean and say nothing, which is the shape this
          # repository keeps catching. Floors, not equalities, so the grid may grow — but it may not
          # shrink: 475 rows today, of which 284 are priced. (P51 moved the rate floor to 8000 Hz: the 1000 Hz
          # rows went to zero, the 2000 Hz rows left the grid, and 7999 / 12000 / 16000 joined — 425 / 280 before.)
          [ "$(wc -l < storage-native.txt)" -ge 475 ] \
            || { echo "the storage table lost rows — a smaller grid still compares clean"; exit 1; }
          [ "$(grep -cv ' 0$' storage-native.txt)" -ge 284 ] \
            || { echo "the storage table is mostly refusals — it is comparing nothing"; exit 1; }
          for mod in fcprobe.node.js fcprobe.debug.js; do
            node tools/wasm/storage-probe.mjs "tools/wasm/build/$mod" table > storage-wasm.txt
            cmp storage-native.txt storage-wasm.txt || { echo "the published demand differs between tiers ($mod)"; exit 1; }
            node tools/wasm/storage-probe.mjs "tools/wasm/build/$mod" check
          done
          echo "identical on both tiers: $(wc -l < storage-native.txt) rows of published demand, release and checked"

  # eqviz — renders the per-filter PNG quality maps (digital vs independent analog references) and
  # uploads them as a PR artifact, so a reviewer SEES filter quality instead of trusting their ears.
  # Fails only on crash / unstable-or-non-finite designs (black cells); colour judgement stays human.
  eqviz:
    name: eqviz-quality-pictures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_BUILD_TESTS=OFF
      - name: Build eqviz
        run: cmake --build build -j 4 --target eqviz
      - name: Render quality maps
        run: mkdir -p eqviz-out && ./build/tools/eqviz eqviz-out --fs 44100,48000,96000,192000
      - uses: actions/upload-artifact@v7
        with:
          name: eqviz-quality-pictures
          path: eqviz-out/
          if-no-files-found: error

  # Publishes the EQ Filter Quality Atlas: renders the eqviz maps for main and force-pushes them to
  # the orphan single-commit branch `quality-report` (history never accumulates), where GitHub renders
  # README.md with the images inline. The main README links to it.
  quality-atlas:
    name: publish-quality-atlas
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_BUILD_TESTS=OFF
      - name: Build eqviz
        run: cmake --build build -j 4 --target eqviz
      - name: Render the atlas
        run: |
          mkdir -p atlas
          ./build/tools/eqviz atlas --fs 44100,48000,96000,192000
          { echo "<!-- auto-generated by the quality-atlas CI job; do not edit -->"
            echo ""
            cat atlas/index.md
            echo ""
            echo "---"
            echo "Generated from \`${GITHUB_SHA}\` on $(date -u +%Y-%m-%d) by [tools/eqviz](https://github.com/${GITHUB_REPOSITORY}/blob/main/tools/eqviz/eqviz.cpp)."
          } > atlas/README.md
          rm atlas/index.md
      - name: Publish to the quality-report branch (orphan, force-pushed)
        run: |
          cd atlas
          git init -b quality-report
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "EQ Filter Quality Atlas for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" quality-report
